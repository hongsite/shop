<script>
$(document).ready(function(){
	$('#mydump').click(function() {
        $('#openbox_dump').removeClass('none');
    });
	
	$('#myfile_dump').live('click', function(e){		
		$('#uploadfile_dump').click();		
    });
	$('#uploadfile_dump').live('change',function(){
		var fileInput = $('#uploadfile_dump').get(0);
		var files = fileInput.files;
		var file = files[0];
		var filesize = getfilesize(file.size);
		var name = file.name;
		var html = getmbhtml('chooselist',[{filesize:filesize,name:name}]);
		$('#chooselist').html(html);
	});
	$('#removefile').live('click', function(e){
		document.getElementById('myform_dump').reset();
		$('#chooselist').html('');		
    });
	$('#mysubmit_dump').click(function() {
        var fileInput = $('#uploadfile_dump').get(0);
		var files = fileInput.files;
		const maxFiles = 5;
		var allowedExts = ['xlsx'];
		var filenums = files.length;	

		if(filenums<1){
			layer.msg('请选择一个文件');
			return ;
		}		
		// 遍历所有文件进行上传
		var file = files[0];
		// 获取文件扩展名
		var ext = file.name.split('.').pop().toLowerCase();
		if (!allowedExts.includes(ext)) {
			layer.msg('格式不正确，请上传 ' + allowedExts.join('|') + ' 格式的文件');
			return;
		}
		if(file.size>102400*50){
			layer.msg( '不能上传大于5M的文件',{icon:2});
			return ;
		}		
		
		var file = files[0];
		let fd = new FormData();
		fd.append('fileToUpload',file);	
		fd.append('path','pic1');					
		upload_excel(file,fd,'_after_upload_dump');
    });
});
</script>
